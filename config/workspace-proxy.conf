# Development ingress. Only the event prefix reaches the streaming process.
resolver 127.0.0.11 ipv6=off valid=10s;
upstream pandect_web {
    zone pandect_web 64k;
    server web:8000 resolve;
}
upstream pandect_events {
    zone pandect_events 64k;
    server events:8000 resolve;
}
server {
    listen 8000;
    access_log off;
    # nginx error messages can include request URLs and query strings.
    error_log /dev/null;
    client_max_body_size 1026m;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 180s;

    location /events/ { proxy_pass http://pandect_events; }
    location / { proxy_pass http://pandect_web; }
}
