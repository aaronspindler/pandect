<figure class="workspace-example">
  <figcaption><strong>Workspace preview</strong><span>Fictional case</span></figcaption>
  <div class="example-shell">
    <div class="example-sidebar">
      <span class="example-label">Case</span>
      <strong>Riverside site review</strong>
      <div class="example-sections">
        <span>Overview</span>
        <span class="example-selected">{% include 'components/icon.html' with name='files' %} Evidence</span>
        <span>Analysis</span>
        <span>People</span>
        <span>Vehicles</span>
      </div>
    </div>
    <div class="example-list">
      <div class="example-list-heading"><strong>Evidence</strong><span>3 records</span></div>
      <div class="example-record active">{% include 'components/icon.html' with name='file-text' %}<span><strong>Site visit note</strong><small>Text · Field notebook</small></span></div>
      <div class="example-record">{% include 'components/icon.html' with name='files' %}<span><strong>East gate photo</strong><small>Image · Site visit</small></span></div>
      <div class="example-record">{% include 'components/icon.html' with name='file-text' %}<span><strong>Public planning notice</strong><small>Document · Council archive</small></span></div>
    </div>
    <div class="example-detail">
      <span class="example-label">Text evidence</span>
      <strong class="example-title">Site visit note</strong>
      <p class="example-source">Source: Field notebook</p>
      <div class="example-original">
        <span class="example-label">Original text</span>
        <p>At 09:15 the east gate was locked. A sign directed visitors to reception on Dock Street.</p>
      </div>
      <div class="example-note">
        <span class="example-label">Observed keywords</span>
        <p>dock · gate · reception</p>
      </div>
    </div>
  </div>
