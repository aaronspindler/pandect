{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pandect{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/pandect.css' %}">
    <script src="{% static 'vendor/htmx/htmx-2.0.10.min.js' %}" defer></script>
  </head>
  <body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <header class="site-header">
      <a class="site-name" href="{% url 'home' %}">Pandect</a>
      <nav aria-label="Primary navigation">
        <a href="{% url 'home' %}"{% if request.resolver_match.url_name == "home" or request.resolver_match.url_name == "runtime-status" %} aria-current="page"{% endif %}>Home</a>
        <a href="{% url 'catalogue' %}"{% if request.path|slice:":11" == "/catalogue/" %} aria-current="page"{% endif %}>Catalogue</a>
      </nav>
    </header>
    <div id="notifications" role="status" aria-live="polite"></div>
    <main id="main-content" tabindex="-1">
      {% block content %}{% endblock %}
    </main>
    <footer>
      <small>Local-first investigation workspace</small>
    </footer>
  </body>
</html>
