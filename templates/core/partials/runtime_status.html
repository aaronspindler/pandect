<section id="runtime-status" class="runtime-card" aria-labelledby="runtime-status-heading" aria-live="polite">
  <header class="runtime-card__header">
    <div>
      <p class="eyebrow">System check</p>
      <h2 id="runtime-status-heading">Runtime status</h2>
    </div>
    <span class="status-indicator"><span aria-hidden="true"></span>{{ runtime_state|capfirst }}</span>
  </header>
  <dl>
    <div>
      <dt>Application</dt>
      <dd>{{ runtime_state }}</dd>
    </div>
    <div>
      <dt>Checked</dt>
      <dd><time datetime="{{ checked_at|date:'c' }}">{{ checked_at|date:"Y-m-d H:i:s T" }}</time></dd>
    </div>
  </dl>
  <form
    action="{% url 'runtime-status' %}"
    method="post"
    hx-post="{% url 'runtime-status' %}"
    hx-target="#runtime-status"
    hx-swap="outerHTML"
  >
    {% csrf_token %}
    <button class="button-secondary" type="submit">Refresh status</button>
  </form>
</section>
