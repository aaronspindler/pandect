{% load static %}{% with icon_name=name|default:'file-text' %}{% if icon_name == 'image' %}<img class="icon" src="{% static 'pandect/icons/photo.svg' %}" alt="" aria-hidden="true" width="24" height="24">{% elif icon_name == 'info' %}<img class="icon" src="{% static 'pandect/icons/alert-circle.svg' %}" alt="" aria-hidden="true" width="24" height="24">{% elif icon_name == 'file' %}<img class="icon" src="{% static 'pandect/icons/file-text.svg' %}" alt="" aria-hidden="true" width="24" height="24">{% else %}<img class="icon" src="{% static 'pandect/icons/'|add:icon_name|add:'.svg' %}" alt="" aria-hidden="true" width="24" height="24">{% endif %}{% endwith %}
