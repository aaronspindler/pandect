{% for group in result_groups %}
  {% if group.source %}{% include 'core/analysis/source_heading.html' with source=group.source only %}{% endif %}
  {% if group.recording_url %}
  <audio controls preload="none" src="{{ group.recording_url }}" aria-label="Recording for {{ group.source.label }}"><a href="{{ group.recording_url }}">Play source recording</a></audio>
  {% endif %}
  {% for item in group.items %}{% include 'core/analysis/finding.html' %}{% endfor %}
{% endfor %}
