{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="{{ label }}">
  {% if page_obj.has_previous %}<a class="button button-secondary" href="{% querystring page=page_obj.previous_page_number %}{% if anchor %}#{{ anchor }}{% endif %}">Previous</a>{% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="button button-secondary" href="{% querystring page=page_obj.next_page_number %}{% if anchor %}#{{ anchor }}{% endif %}">Next</a>{% endif %}
</nav>
{% endif %}
