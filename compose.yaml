services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pandect}
      POSTGRES_USER: ${POSTGRES_USER:-pandect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PANDECT_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-pandect}-app
    environment: &app_environment
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      POSTGRES_DB: ${POSTGRES_DB:-pandect}
      POSTGRES_USER: ${POSTGRES_USER:-pandect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PANDECT_PUBLIC_ORIGIN: ${PANDECT_PUBLIC_ORIGIN:-http://localhost:8000}
      PANDECT_INVITATION_DAYS: ${PANDECT_INVITATION_DAYS:-7}
      PANDECT_MAX_FILE_BYTES: ${PANDECT_MAX_FILE_BYTES:-104857600}
      PANDECT_MAX_TEXT_BYTES: ${PANDECT_MAX_TEXT_BYTES:-1048576}
      PANDECT_MAX_BATCH_FILES: ${PANDECT_MAX_BATCH_FILES:-20}
      PANDECT_AI_ACCOUNT_ID: ${PANDECT_AI_ACCOUNT_ID:-}
      PANDECT_AI_GATEWAY_ID: ${PANDECT_AI_GATEWAY_ID:-}
      PANDECT_AI_GATEWAY_TOKEN: ${PANDECT_AI_GATEWAY_TOKEN:-}
      PANDECT_AI_WORKERS_TOKEN: ${PANDECT_AI_WORKERS_TOKEN:-}
      PANDECT_AI_TIMEOUT: ${PANDECT_AI_TIMEOUT:-60}
      PANDECT_AI_DAILY_CASE_REQUESTS: ${PANDECT_AI_DAILY_CASE_REQUESTS:-100}
      PANDECT_AI_MAX_REQUEST_BYTES: ${PANDECT_AI_MAX_REQUEST_BYTES:-8388608}
      PANDECT_AI_MAX_RESPONSE_BYTES: ${PANDECT_AI_MAX_RESPONSE_BYTES:-2097152}
      PANDECT_AI_TEXT_MODEL: ${PANDECT_AI_TEXT_MODEL:-@cf/meta/llama-3.3-70b-instruct-fp8-fast}
      PANDECT_AI_TRANSCRIPTION_MODEL: ${PANDECT_AI_TRANSCRIPTION_MODEL:-@cf/openai/whisper-large-v3-turbo}
      PANDECT_LOCAL_TEXT_URL: ${PANDECT_LOCAL_TEXT_URL:-}
      PANDECT_LOCAL_TEXT_MODEL: ${PANDECT_LOCAL_TEXT_MODEL:-Qwen3-8B-Q4_K_M}
      PANDECT_LOCAL_TEXT_SHA256: ${PANDECT_LOCAL_TEXT_SHA256:-}
      PANDECT_LOCAL_TEXT_RUNTIME: ${PANDECT_LOCAL_TEXT_RUNTIME:-llama.cpp@8642541b255bfb5dc39cd351a178be09013a55d6}
      PANDECT_LOCAL_TEXT_CONTEXT_TOKENS: ${PANDECT_LOCAL_TEXT_CONTEXT_TOKENS:-32768}
      PANDECT_LOCAL_TRANSCRIPTION_URL: ${PANDECT_LOCAL_TRANSCRIPTION_URL:-}
      PANDECT_LOCAL_TRANSCRIPTION_MODEL: ${PANDECT_LOCAL_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      PANDECT_LOCAL_TRANSCRIPTION_SHA256: ${PANDECT_LOCAL_TRANSCRIPTION_SHA256:-}
      PANDECT_LOCAL_TRANSCRIPTION_RUNTIME: ${PANDECT_LOCAL_TRANSCRIPTION_RUNTIME:-whisper.cpp@d1be6fde11ac6e0407606b4e42fe72d34add8037}
      PANDECT_LOCAL_AI_TOKEN: ${PANDECT_LOCAL_AI_TOKEN:-}
      PANDECT_LOCAL_AI_TIMEOUT: ${PANDECT_LOCAL_AI_TIMEOUT:-600}
      PANDECT_LOCAL_AI_MAX_REQUEST_BYTES: ${PANDECT_LOCAL_AI_MAX_REQUEST_BYTES:-8388608}
      PANDECT_LOCAL_AI_MAX_RESPONSE_BYTES: ${PANDECT_LOCAL_AI_MAX_RESPONSE_BYTES:-2097152}
      PANDECT_LOCAL_AI_MAX_OUTPUT_TOKENS: ${PANDECT_LOCAL_AI_MAX_OUTPUT_TOKENS:-4096}
      PANDECT_GEOCODER_URL: ${PANDECT_GEOCODER_URL:-}
      PANDECT_GEOCODER_LOCAL: ${PANDECT_GEOCODER_LOCAL:-false}
      PANDECT_GEOCODER_NAME: ${PANDECT_GEOCODER_NAME:-}
      PANDECT_GEOCODER_VERSION: ${PANDECT_GEOCODER_VERSION:-}
      PANDECT_GEOCODER_ATTRIBUTION: ${PANDECT_GEOCODER_ATTRIBUTION:-}
      PANDECT_GEOCODER_USER_AGENT: ${PANDECT_GEOCODER_USER_AGENT:-Pandect/0.1}
      PANDECT_GEOCODER_TIMEOUT: ${PANDECT_GEOCODER_TIMEOUT:-10}
      PANDECT_MAP_CONTEXT_URL: ${PANDECT_MAP_CONTEXT_URL:-}
      PANDECT_MAP_CONTEXT_LOCAL: ${PANDECT_MAP_CONTEXT_LOCAL:-false}
      PANDECT_MAP_TILE_URL: ${PANDECT_MAP_TILE_URL:-}
      PANDECT_MAP_TILE_ATTRIBUTION: ${PANDECT_MAP_TILE_ATTRIBUTION:-}
      PANDECT_MAP_CONTEXT_NAME: ${PANDECT_MAP_CONTEXT_NAME:-}
      PANDECT_MAP_CONTEXT_VERSION: ${PANDECT_MAP_CONTEXT_VERSION:-}
      PANDECT_MAP_CONTEXT_ATTRIBUTION: ${PANDECT_MAP_CONTEXT_ATTRIBUTION:-}
      PANDECT_MAP_CONTEXT_USER_AGENT: ${PANDECT_MAP_CONTEXT_USER_AGENT:-Pandect/0.1}
      PANDECT_MAP_CONTEXT_TIMEOUT: ${PANDECT_MAP_CONTEXT_TIMEOUT:-10}
      PANDECT_MAP_CONTEXT_HISTORY_START: ${PANDECT_MAP_CONTEXT_HISTORY_START:-}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-pandect@localhost}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-localhost}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000 --noreload
    ports:
      - "127.0.0.1:${PANDECT_WEB_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    networks: [default, inference]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
  worker:
    image: ${COMPOSE_PROJECT_NAME:-pandect}-app
    environment: *app_environment
    command: ["python", "manage.py", "db_worker", "--no-reload"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - app_data:/app/data
    networks: [default, inference]
    depends_on:
      web:
        condition: service_healthy

  local-text:
    profiles: [local-ai]
    build: ./inference
    image: ${COMPOSE_PROJECT_NAME:-pandect}-inference
    environment:
      PANDECT_RUNTIME_KIND: text
      PANDECT_RUNTIME_MODEL: ${PANDECT_LOCAL_TEXT_MODEL:-Qwen3-8B-Q4_K_M}
      PANDECT_RUNTIME_MODEL_SHA256: ${PANDECT_LOCAL_TEXT_SHA256:-}
      PANDECT_RUNTIME_CONTEXT_TOKENS: ${PANDECT_LOCAL_TEXT_CONTEXT_TOKENS:-32768}
      PANDECT_RUNTIME_THREADS: ${PANDECT_LOCAL_AI_THREADS:-4}
      PANDECT_RUNTIME_TIMEOUT: ${PANDECT_LOCAL_AI_TIMEOUT:-600}
      PANDECT_RUNTIME_MAX_REQUEST_BYTES: ${PANDECT_LOCAL_AI_MAX_REQUEST_BYTES:-8388608}
      PANDECT_RUNTIME_MAX_RESPONSE_BYTES: ${PANDECT_LOCAL_AI_MAX_RESPONSE_BYTES:-2097152}
      PANDECT_LOCAL_AI_TOKEN: ${PANDECT_LOCAL_AI_TOKEN:-}
    volumes:
      - type: bind
        source: ${PANDECT_LOCAL_TEXT_MODEL_FILE:-./data/models/text.gguf}
        target: /models/model
        read_only: true
        bind:
          create_host_path: false
    networks: [inference]
    read_only: true
    tmpfs: ["/tmp:mode=0700,uid=1000,gid=1000,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${PANDECT_LOCAL_TEXT_MEMORY:-24g}
    cpus: ${PANDECT_LOCAL_AI_CPUS:-4}
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck: &inference_health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s

  local-transcription:
    profiles: [local-ai]
    image: ${COMPOSE_PROJECT_NAME:-pandect}-inference
    build: ./inference
    environment:
      PANDECT_RUNTIME_KIND: transcription
      PANDECT_RUNTIME_MODEL: ${PANDECT_LOCAL_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      PANDECT_RUNTIME_MODEL_SHA256: ${PANDECT_LOCAL_TRANSCRIPTION_SHA256:-}
      PANDECT_RUNTIME_THREADS: ${PANDECT_LOCAL_AI_THREADS:-4}
      PANDECT_RUNTIME_TIMEOUT: ${PANDECT_LOCAL_AI_TIMEOUT:-600}
      PANDECT_RUNTIME_MAX_REQUEST_BYTES: ${PANDECT_LOCAL_AI_MAX_REQUEST_BYTES:-8388608}
      PANDECT_RUNTIME_MAX_RESPONSE_BYTES: ${PANDECT_LOCAL_AI_MAX_RESPONSE_BYTES:-2097152}
      PANDECT_LOCAL_AI_TOKEN: ${PANDECT_LOCAL_AI_TOKEN:-}
    volumes:
      - type: bind
        source: ${PANDECT_LOCAL_TRANSCRIPTION_MODEL_FILE:-./data/models/transcription.bin}
        target: /models/model
        read_only: true
        bind:
          create_host_path: false
    networks: [inference]
    read_only: true
    tmpfs: ["/tmp:mode=0700,uid=1000,gid=1000,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: ${PANDECT_LOCAL_TRANSCRIPTION_MEMORY:-4g}
    cpus: ${PANDECT_LOCAL_AI_CPUS:-4}
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck: *inference_health

networks:
  inference:
    internal: true

volumes:
  postgres_data:
  app_data:
