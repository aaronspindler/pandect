services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie@sha256:ab49524d18df7200b74ac9a475e1db6297fc1eb57da4c214c63d10ecc4b754fa
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pandect}
      POSTGRES_USER: ${POSTGRES_USER:-pandect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: .
    image: ${COMPOSE_PROJECT_NAME:-pandect}-app
    environment: &app_environment
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_TRUST_PROXY_HEADERS: ${DJANGO_TRUST_PROXY_HEADERS:-false}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-}
      POSTGRES_DB: ${POSTGRES_DB:-pandect}
      POSTGRES_USER: ${POSTGRES_USER:-pandect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PANDECT_PUBLIC_ORIGIN: ${PANDECT_PUBLIC_ORIGIN:-http://localhost:${PANDECT_WEB_PORT:-8000}}
      PANDECT_ALLOW_SIGNUPS: ${PANDECT_ALLOW_SIGNUPS:-true}
      PANDECT_TRUSTED_PROXY_COUNT: ${PANDECT_TRUSTED_PROXY_COUNT:-0}
      PANDECT_MEDIA_ROOT: ${PANDECT_MEDIA_ROOT:-/app/data/media}
      PANDECT_INSTAGRAM_PILOT_URL: ${PANDECT_INSTAGRAM_PILOT_URL:-}
      PANDECT_INSTAGRAM_PILOT_KEY: ${PANDECT_INSTAGRAM_PILOT_KEY:-}
      PANDECT_AI_ACCOUNT_ID: ${PANDECT_AI_ACCOUNT_ID:-}
      PANDECT_AI_GATEWAY_ID: ${PANDECT_AI_GATEWAY_ID:-}
      PANDECT_AI_GATEWAY_TOKEN: ${PANDECT_AI_GATEWAY_TOKEN:-}
      PANDECT_AI_WORKERS_TOKEN: ${PANDECT_AI_WORKERS_TOKEN:-}
      PANDECT_AI_UNIFIED_BILLING: ${PANDECT_AI_UNIFIED_BILLING:-false}
      PANDECT_AI_STORED_KEY_PROVIDERS: ${PANDECT_AI_STORED_KEY_PROVIDERS:-}
      PANDECT_AI_TEXT_PROVIDER: ${PANDECT_AI_TEXT_PROVIDER:-}
      PANDECT_AI_OPENAI_KEY_ALIAS: ${PANDECT_AI_OPENAI_KEY_ALIAS:-default}
      PANDECT_AI_TEXT_MODEL: ${PANDECT_AI_TEXT_MODEL-auto}
      PANDECT_AI_TRANSCRIPTION_MODEL: ${PANDECT_AI_TRANSCRIPTION_MODEL:-@cf/openai/whisper-large-v3-turbo}
      PANDECT_AI_TEXT_MODEL_CHOICES: ${PANDECT_AI_TEXT_MODEL_CHOICES:-}
      PANDECT_AI_TRANSCRIPTION_MODEL_CHOICES: ${PANDECT_AI_TRANSCRIPTION_MODEL_CHOICES:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PANDECT_OPENAI_MODEL: ${PANDECT_OPENAI_MODEL:-}
      PANDECT_ANTHROPIC_MODEL: ${PANDECT_ANTHROPIC_MODEL:-}
      PANDECT_LOCAL_TEXT_URL: ${PANDECT_LOCAL_TEXT_URL:-}
      PANDECT_LOCAL_TEXT_MODEL: ${PANDECT_LOCAL_TEXT_MODEL:-qwen3.5:9b}
      PANDECT_LOCAL_TEXT_SHA256: ${PANDECT_LOCAL_TEXT_SHA256:-}
      PANDECT_LOCAL_TEXT_RUNTIME: ${PANDECT_LOCAL_TEXT_RUNTIME:-}
      PANDECT_LOCAL_TRANSCRIPTION_URL: ${PANDECT_LOCAL_TRANSCRIPTION_URL:-}
      PANDECT_LOCAL_TRANSCRIPTION_MODEL: ${PANDECT_LOCAL_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      PANDECT_LOCAL_TRANSCRIPTION_SHA256: ${PANDECT_LOCAL_TRANSCRIPTION_SHA256:-}
      PANDECT_LOCAL_TRANSCRIPTION_RUNTIME: ${PANDECT_LOCAL_TRANSCRIPTION_RUNTIME:-whisper.cpp@d1be6fde11ac6e0407606b4e42fe72d34add8037}
      PANDECT_PREFER_EXTERNAL_TRANSCRIPTION_PROFILE: ${PANDECT_PREFER_EXTERNAL_TRANSCRIPTION_PROFILE:-}
      PANDECT_LOCAL_AI_TOKEN: ${PANDECT_LOCAL_AI_TOKEN:-}
      PANDECT_SEARCH_EMBEDDING_PROVIDER: ${PANDECT_SEARCH_EMBEDDING_PROVIDER:-local}
      PANDECT_SEARCH_RERANK_PROVIDER: ${PANDECT_SEARCH_RERANK_PROVIDER:-disabled}
      PANDECT_LOCAL_RERANK_URL: ${PANDECT_LOCAL_RERANK_URL:-}
      PANDECT_LOCAL_RERANK_REVISION: ${PANDECT_LOCAL_RERANK_REVISION:-}
      PANDECT_LOCAL_RERANK_VERSION: ${PANDECT_LOCAL_RERANK_VERSION:-}
      PANDECT_LOCAL_RERANK_TOKEN: ${PANDECT_LOCAL_RERANK_TOKEN:-}
      PANDECT_LOCAL_EMBEDDING_URL: ${PANDECT_LOCAL_EMBEDDING_URL:-}
      PANDECT_LOCAL_EMBEDDING_MODEL: ${PANDECT_LOCAL_EMBEDDING_MODEL:-all-minilm:22m}
      PANDECT_LOCAL_EMBEDDING_SHA256: ${PANDECT_LOCAL_EMBEDDING_SHA256:-}
      PANDECT_LOCAL_EMBEDDING_RUNTIME: ${PANDECT_LOCAL_EMBEDDING_RUNTIME:-}
      PANDECT_GEOCODER_URL: ${PANDECT_GEOCODER_URL:-}
      PANDECT_GEOCODER_LOCAL: ${PANDECT_GEOCODER_LOCAL:-false}
      PANDECT_GEOCODER_NAME: ${PANDECT_GEOCODER_NAME:-}
      PANDECT_GEOCODER_VERSION: ${PANDECT_GEOCODER_VERSION:-}
      PANDECT_GEOCODER_ATTRIBUTION: ${PANDECT_GEOCODER_ATTRIBUTION:-}
      PANDECT_GEOCODER_USER_AGENT: ${PANDECT_GEOCODER_USER_AGENT:-Pandect/0.1}
      PANDECT_MAP_CONTEXT_URL: ${PANDECT_MAP_CONTEXT_URL:-}
      PANDECT_MAP_CONTEXT_LOCAL: ${PANDECT_MAP_CONTEXT_LOCAL:-false}
      PANDECT_MAP_TILE_URL: ${PANDECT_MAP_TILE_URL:-}
      PANDECT_MAP_TILE_ATTRIBUTION: ${PANDECT_MAP_TILE_ATTRIBUTION:-}
      PANDECT_MAP_CONTEXT_NAME: ${PANDECT_MAP_CONTEXT_NAME:-}
      PANDECT_MAP_CONTEXT_VERSION: ${PANDECT_MAP_CONTEXT_VERSION:-}
      PANDECT_MAP_CONTEXT_ATTRIBUTION: ${PANDECT_MAP_CONTEXT_ATTRIBUTION:-}
      PANDECT_MAP_CONTEXT_USER_AGENT: ${PANDECT_MAP_CONTEXT_USER_AGENT:-Pandect/0.1}
      PANDECT_MAP_CONTEXT_HISTORY_START: ${PANDECT_MAP_CONTEXT_HISTORY_START:-}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-localhost}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn --config config/gunicorn.py config.asgi:application
    ports:
      - "127.0.0.1:${PANDECT_WEB_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    networks: [default, inference]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
  worker:
    image: ${COMPOSE_PROJECT_NAME:-pandect}-app
    environment: *app_environment
    command: ["sh", "-c", "python manage.py prepare_case_search && exec python manage.py db_worker --no-reload"]
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - app_data:/app/data
    networks: [default, inference]
    depends_on:
      web:
        condition: service_healthy

  instagram-pilot:
    profiles: [instagram-pilot]
    build: ./instagram_pilot
    networks: [instagram]
    read_only: true
    tmpfs: ["/tmp:mode=1777,size=256m"]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  instagram-worker:
    profiles: [instagram-pilot]
    image: ${COMPOSE_PROJECT_NAME:-pandect}-app
    environment: *app_environment
    command: ["python", "manage.py", "db_worker", "--no-reload", "--queue-name", "instagram"]
    restart: unless-stopped
    stop_grace_period: 60s
    volumes:
      - app_data:/app/data
    networks: [default, instagram]
    depends_on:
      web:
        condition: service_healthy
      instagram-pilot:
        condition: service_healthy

  local-transcription:
    profiles: [local-ai]
    image: ${COMPOSE_PROJECT_NAME:-pandect}-inference
    build: ./inference
    environment:
      PANDECT_RUNTIME_MODEL: ${PANDECT_LOCAL_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      PANDECT_RUNTIME_MODEL_SHA256: ${PANDECT_LOCAL_TRANSCRIPTION_SHA256:-}
      PANDECT_LOCAL_AI_TOKEN: ${PANDECT_LOCAL_AI_TOKEN:-}
    volumes:
      - type: bind
        source: ${PANDECT_LOCAL_TRANSCRIPTION_MODEL_FILE:-./data/models/transcription.bin}
        target: /models/model
        read_only: true
        bind:
          create_host_path: false
    networks: [inference]
    read_only: true
    tmpfs: ["/tmp:mode=0700,uid=1000,gid=1000,size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 600s

networks:
  instagram:
    internal: true
  inference:
    internal: true

volumes:
  postgres_data:
  app_data:
