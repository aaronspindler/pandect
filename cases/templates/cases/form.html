{% extends "ui/base.html" %}
{% block title %}Create case{% endblock %}
{% block content %}
<div class="page-header">
<div>
<h1>Create case</h1>
<p class="muted">You will own this case and can invite collaborators.</p>
</div>
</div>
<form method="post" class="form-panel" data-unsaved-form>
{% csrf_token %}{% include "ui/components/form_fields.html" %}
<div class="form-actions">
<button class="button button-primary" type="submit">Create case</button>
<a class="button" href="{% url 'cases:case_list' %}">Cancel</a>
</div>
</form>
{% endblock %}
