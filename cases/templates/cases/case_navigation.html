{% with route=request.resolver_match %}
    <a class="app-rail-link" href="{% url 'core:analysis:index' case.pk %}" aria-label="Case Tools" data-tooltip="Case Tools" title="Case Tools"{% if nav_section != 'evidence' and nav_section != 'processing' and route.namespace != 'core:evidence' and route.namespace != 'core:search' or nav_section == 'chronology' %} aria-current="page"{% endif %}>{% include 'ui/components/icon.html' with name='stack' %}<span class="app-rail-label">Case Tools</span></a>
    <a class="app-rail-link" href="{% url 'core:evidence:list' case.pk %}" aria-label="Evidence" data-tooltip="Evidence" title="Evidence"{% if nav_section == 'evidence' or route.namespace == 'core:evidence' and nav_section != 'chronology' %} aria-current="page"{% endif %}>{% include 'ui/components/icon.html' with name='files' %}<span class="app-rail-label">Evidence</span></a>
    <a class="app-rail-link" href="{% url 'core:analysis:processing' case.pk %}" aria-label="Processing" data-tooltip="Processing" title="Processing"{% if nav_section == 'processing' %} aria-current="page"{% endif %}>{% include 'ui/components/icon.html' with name='settings' %}<span class="app-rail-label">Processing</span></a>
{% endwith %}
