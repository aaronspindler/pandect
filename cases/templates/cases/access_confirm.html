{% extends "ui/base.html" %}
{% block title %}{{ action }}{% endblock %}
{% block content %}
<p class="breadcrumb"><a href="{% url 'cases:case_settings' case.pk %}">Back to case settings</a></p>
<div class="page-header">
<div>
<p class="eyebrow">{{ case.name }}</p>
<h1>{{ action }}?</h1>
<p>
<strong>{{ target }}</strong>
</p>
<p>{{ explanation }}</p>
</div>
</div>
<form method="post" class="form-panel">
{% csrf_token %}{% include "ui/components/form_fields.html" %}
<div class="form-actions">
<button class="button button-danger" type="submit">{{ action }}</button>
<a class="button" href="{% url 'cases:case_settings' case.pk %}">Cancel</a>
</div>
</form>
{% endblock %}
