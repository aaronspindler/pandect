[project]
name = "pandect"
version = "0.1.0a1"
description = "Local-first investigation application"
license = "Apache-2.0"
authors = [{ name = "Aaron Spindler" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2.17,<5.3",
    "gunicorn>=23,<24",
    "httpx>=0.28,<0.29",
    "huey>=3.4.0,<4",
    "jsonschema>=4.25,<5",
    "opencv-python-headless==4.14.0.94",
    "openvino==2026.2.1",
    "Pillow>=11.3,<13",
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pandect.config.test_settings"
addopts = "-ra"
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = [
    "media_runner: exercise runner routing without the explicit extractor unit-test context",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]
