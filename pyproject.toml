[project]
name = "pandect"
version = "0.1.0"
description = "Local-first investigation application"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "gunicorn>=23,<24",
    "huey>=3.3,<4",
    "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pandect.config.test_settings"
addopts = "-ra"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "DJ", "E", "F", "I", "UP"]
