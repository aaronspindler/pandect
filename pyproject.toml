[project]
name = "pandect"
version = "0.1.0"
description = "An approachable investigation and intelligence platform."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.14.9,<3.15"
dependencies = [
    "av==19.0.2",
    "django>=6.1.3,<6.2",
    "django-allauth>=65.22.1,<66",
    "django-tasks-db>=0.13.0,<0.14",
    "gunicorn>=27.0.1,<28",
    "opencv-python-headless>=5.1.0.95,<6",
    "osm2geojson>=0.3,<1",
    "pgvector>=0.5.1,<0.6",
    "pillow>=13.0.0,<14",
    "psycopg[binary]>=3.3.9,<4",
    "pypdf>=7.1.1,<8",
    "pypdfium2==5.15.2",
    "shapely>=2,<3",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "playwright>=1.65.2,<2",
    "ruff>=0.17.6,<1",
]

[tool.uv]
package = false
required-version = ">=0.13.7,<0.14"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
