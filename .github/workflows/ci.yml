name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Classify changes and validate source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: read
    outputs:
      full: ${{ steps.changes.outputs.full }}
    env:
      DJANGO_SECRET_KEY: synthetic-static-ci-secret-not-for-deployment
      POSTGRES_PASSWORD: synthetic-static-ci-password
    steps:
      - name: Check out full history for classification and repository hygiene
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify application changes conservatively
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/classify-ci-changes.py
      - name: Install uv and the pinned Python runtime
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Validate source, dependency lock, and Compose configuration
        run: make static-check
      - name: Check changed whitespace
        if: steps.changes.outputs.base != '' && steps.changes.outputs.head != ''
        env:
          CHECK_BASE: ${{ steps.changes.outputs.base }}
          CHECK_HEAD: ${{ steps.changes.outputs.head }}
        run: git diff --check "$CHECK_BASE" "$CHECK_HEAD"
      - name: Test CI classification and deployment contracts
        run: uv run --locked python -m unittest config.tests.test_ci_changes config.tests.test_dokploy_deploy config.tests.test_github_release config.tests.test_compose_smoke

  check:
    name: Test and validate (${{ matrix.architecture }})
    needs: static
    if: needs.static.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: synthetic-ci-secret-not-for-deployment
      POSTGRES_DB: pandect
      POSTGRES_USER: pandect
      POSTGRES_PASSWORD: synthetic-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pandect
          POSTGRES_USER: pandect
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pandect -d pandect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and the pinned Python runtime
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install local OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Apply initial migrations to PostgreSQL
        run: uv run --locked python manage.py migrate --noinput
      - name: Test against PostgreSQL and validate database configuration
        run: make test database-check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and load the native smoke image
        id: smoke-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.architecture }}
          load: true
          build-args: APP_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,version=2,scope=pandect-app-${{ matrix.architecture }}
          cache-to: ${{ github.repository == 'aaronspindler/pandect' && github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=gha,version=2,scope=pandect-app-{0},mode=max,ignore-error=true', matrix.architecture) || '' }}
      - name: Exercise isolated first-run and recovery with the built image
        env:
          SMOKE_IMAGE: ${{ steps.smoke-image.outputs.imageid }}
        run: sh scripts/compose-smoke.sh "$SMOKE_IMAGE"

  browser:
    name: Investigator journeys (${{ matrix.engine }})
    needs: static
    if: needs.static.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: synthetic-browser-ci-secret-not-for-deployment
      POSTGRES_DB: pandect_browser
      POSTGRES_USER: pandect
      POSTGRES_PASSWORD: synthetic-browser-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      PANDECT_BROWSER_ENGINES: ${{ matrix.engine }}
      PANDECT_BROWSER_ARTIFACTS: data/validation/browser/${{ matrix.engine }}
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pandect_browser
          POSTGRES_USER: pandect
          POSTGRES_PASSWORD: synthetic-browser-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pandect -d pandect_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and the pinned Python runtime
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Prefer Ubuntu's primary package mirrors
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
      - name: Install local OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install the selected browser and Linux dependencies
        run: uv run --locked playwright install --with-deps "${{ matrix.engine }}"
      - name: Exercise core user journeys and responsive layouts
        run: make browser-check

  security:
    name: Locked Python dependency audit
    needs: static
    if: needs.static.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and the pinned Python runtime
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Audit locked dependencies
        run: make security-check

  images:
    name: Publish production image
    needs: [static, check, browser, security]
    if: >-
      needs.static.outputs.full == 'true' &&
      github.repository == 'aaronspindler/pandect' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set the production image name
        id: image
        shell: bash
        run: printf 'name=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push the production image
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: APP_COMMIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:build-${{ github.run_id }}
          cache-from: type=gha,version=2,scope=pandect-app-amd64
          cache-to: type=gha,version=2,scope=pandect-app-amd64,mode=max,ignore-error=true
      - name: Record the published immutable image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          # shellcheck disable=SC2016
          printf 'Published `%s@%s` for `%s`.\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  status:
    name: CI status
    needs: [static, check, browser, security, images]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
      PUBLISH_EXPECTED: ${{ github.repository == 'aaronspindler/pandect' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Require successful checks or deliberate documentation-only skips
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ['RESULTS'])
          full = jobs['static']['outputs'].get('full')
          valid = jobs['static']['result'] == 'success' and full in {'true', 'false'}
          expected = 'success' if full == 'true' else 'skipped'
          valid = valid and all(jobs[name]['result'] == expected for name in ('check', 'browser', 'security'))
          image_expected = 'success' if full == 'true' and os.environ['PUBLISH_EXPECTED'] == 'true' else 'skipped'
          valid = valid and jobs['images']['result'] == image_expected
          if not valid:
              print('CI failed: a required job failed, was cancelled, or was unexpectedly skipped.')
              sys.exit(1)
          print('All required checks passed.' if full == 'true' else 'Documentation-only checks passed; application jobs and publication were intentionally skipped.')
          PY
