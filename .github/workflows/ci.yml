name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, lint, and validate (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: synthetic-ci-secret-not-for-deployment
      POSTGRES_DB: pandect
      POSTGRES_USER: pandect
      POSTGRES_PASSWORD: synthetic-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pandect
          POSTGRES_USER: pandect
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pandect -d pandect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv and the pinned Python runtime
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Install local OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Apply initial migrations to PostgreSQL
        run: uv run --locked python manage.py migrate --noinput

      - name: Lint, test against PostgreSQL, and validate configuration
        run: make check

      - name: Exercise isolated first-run and recovery workflow
        run: make compose-smoke

  browser:
    name: Investigator journeys (Chromium and WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: synthetic-browser-ci-secret-not-for-deployment
      POSTGRES_DB: pandect_browser
      POSTGRES_USER: pandect
      POSTGRES_PASSWORD: synthetic-browser-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      PANDECT_BROWSER_ARTIFACTS: data/validation/browser
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pandect_browser
          POSTGRES_USER: pandect
          POSTGRES_PASSWORD: synthetic-browser-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pandect -d pandect_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and the pinned Python runtime
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Prefer Ubuntu's primary package mirrors
        run: sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
      - name: Install local OCR
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install locked dependencies
        run: uv sync --locked
      - name: Install browser engines and Linux dependencies
        run: uv run --locked playwright install --with-deps chromium webkit
      - name: Exercise core user journeys and responsive layouts
        run: make browser-check

  security:
    name: Locked Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and the pinned Python runtime
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true

      - name: Audit locked dependencies
        run: make security-check

  images:
    name: Publish production image
    needs: [check, browser, security]
    if: >-
      github.repository == 'aaronspindler/pandect' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the production image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build --push --platform linux/amd64 \
            --build-arg "APP_COMMIT_SHA=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${image}:${GITHUB_SHA}" --tag "${image}:build-${GITHUB_RUN_ID}" \
            --metadata-file /tmp/pandect-image-metadata.json .
          digest="$(python3 -c 'import json; print(json.load(open("/tmp/pandect-image-metadata.json"))["containerimage.digest"])')"
          # Backticks in the build summary are literal Markdown.
          # shellcheck disable=SC2016
          printf 'Published `%s@%s` for `%s`.\n' "$image" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
