name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test, lint, and validate (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Python
        run: make lint

      - name: Run tests
        run: make test

      - name: Validate application and container configuration
        run: make validate

      - name: Exercise isolated first-run and recovery workflow
        run: make compose-smoke

  security:
    name: Secret, dependency, and image audit
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out all publishable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run explicit network-enabled security checks
        run: make security-check
