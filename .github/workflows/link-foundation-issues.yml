name: Link Pandect foundation issues

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/link-foundation-issues.yml

permissions:
  contents: read
  issues: write

jobs:
  link-foundation-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Create and verify native issue relationships
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          api() {
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$@"
          }

          issue_id() {
            api "repos/${REPOSITORY}/issues/$1" --jq '.id'
          }

          relationship_contains() {
            local endpoint="$1"
            local issue_number="$2"
            api "${endpoint}?per_page=100" --jq '.[].number' | grep -Fxq "${issue_number}"
          }

          add_sub_issue() {
            local parent_number="$1"
            local child_number="$2"

            if relationship_contains \
              "repos/${REPOSITORY}/issues/${parent_number}/sub_issues" \
              "${child_number}"; then
              echo "#${child_number} is already a sub-issue of #${parent_number}"
              return
            fi

            local child_id
            child_id="$(issue_id "${child_number}")"
            api --method POST \
              "repos/${REPOSITORY}/issues/${parent_number}/sub_issues" \
              -F "sub_issue_id=${child_id}" \
              >/dev/null
            echo "Added #${child_number} as a sub-issue of #${parent_number}"
          }

          add_blocked_by() {
            local issue_number="$1"
            local blocker_number="$2"

            if relationship_contains \
              "repos/${REPOSITORY}/issues/${issue_number}/dependencies/blocked_by" \
              "${blocker_number}"; then
              echo "#${issue_number} is already blocked by #${blocker_number}"
              return
            fi

            local blocker_id
            blocker_id="$(issue_id "${blocker_number}")"
            api --method POST \
              "repos/${REPOSITORY}/issues/${issue_number}/dependencies/blocked_by" \
              -F "issue_id=${blocker_id}" \
              >/dev/null
            echo "Marked #${issue_number} as blocked by #${blocker_number}"
          }

          for child_number in 2 3 4 5 6 7 8 9 10; do
            add_sub_issue 1 "${child_number}"
          done

          # Record only immediate blockers. Transitive prerequisites are represented
          # by the dependency chain rather than repeated on every downstream issue.
          add_blocked_by 3 2
          add_blocked_by 4 3
          add_blocked_by 5 3
          add_blocked_by 6 4
          add_blocked_by 7 6
          add_blocked_by 8 7
          add_blocked_by 9 5
          add_blocked_by 9 8
          add_blocked_by 10 9

          expected_sub_issues="2,3,4,5,6,7,8,9,10"
          actual_sub_issues="$(
            api "repos/${REPOSITORY}/issues/1/sub_issues?per_page=100" \
              --jq 'sort_by(.number) | map(.number) | join(",")'
          )"
          test "${actual_sub_issues}" = "${expected_sub_issues}"

          verify_blocked_by() {
            local issue_number="$1"
            local expected="$2"
            local actual
            actual="$(
              api "repos/${REPOSITORY}/issues/${issue_number}/dependencies/blocked_by?per_page=100" \
                --jq 'sort_by(.number) | map(.number) | join(",")'
            )"
            test "${actual}" = "${expected}"
          }

          verify_blocked_by 2 ""
          verify_blocked_by 3 "2"
          verify_blocked_by 4 "3"
          verify_blocked_by 5 "3"
          verify_blocked_by 6 "4"
          verify_blocked_by 7 "6"
          verify_blocked_by 8 "7"
          verify_blocked_by 9 "5,8"
          verify_blocked_by 10 "9"

          echo "All native Pandect foundation issue relationships are configured."
