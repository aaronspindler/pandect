version: 2
updates:
  - package-ecosystem: uv
    # Updates pyproject.toml and uv.lock together, including the dev group.
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    # PostgreSQL major upgrades need an explicit data migration plan.
    ignore:
      # Every Python image update must match the exact host/runtime pins.
      - dependency-name: python
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-dependencies:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
