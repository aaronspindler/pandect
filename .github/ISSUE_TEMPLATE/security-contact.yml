name: Request a private security contact
description: Ask for a private reporting channel if the GitHub advisory form is unavailable.
title: Request for a private security contact
body:
  - type: markdown
    attributes:
      value: "Please provide a private security reporting channel. Keep vulnerability details, affected systems, and investigation material out of this issue."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue requests contact only and contains no vulnerability details or private material.
          required: true
