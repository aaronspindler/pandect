name: Bug report
description: Report a reproducible problem using synthetic data only.
body:
  - type: markdown
    attributes:
      value: "Follow the [security reporting policy](https://github.com/aaronspindler/pandect/blob/main/SECURITY.md) for vulnerabilities. Use synthetic evidence and redacted diagnostics. Never attach real originals, databases, embeddings, backups, or environment files."
  - type: input
    id: version
    attributes:
      label: Tag or commit
      placeholder: Exact commit SHA or release tag
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Host OS, amd64/arm64, Docker and Compose versions, and Docker memory allocation. No personal paths.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Minimal steps, expected result, and actual result. Describe how to generate input without real evidence.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Relevant error codes or short redacted logs only. Review every line before submitting.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real investigation evidence, personal data, or credentials.
          required: true
