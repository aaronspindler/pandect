<form id="case-search" role="search" aria-label="Case-wide search" action="{% url 'core:search:results' case.pk %}" method="get" data-suggestions-url="{% url 'core:search:suggestions' case.pk %}">
  <label class="visually-hidden" for="case-search-query">Search this case</label>
  <input id="case-search-query" name="q" type="search" value="{{ case_search_query }}" placeholder="Search this case" maxlength="200" autocomplete="off" spellcheck="false"{% if search_form.q.errors %} aria-invalid="true" aria-describedby="case-query-errors"{% endif %}>
  <kbd aria-hidden="true" class="case-search-shortcut" hidden></kbd>
  <button class="icon-button case-search-submit" type="submit" aria-label="Find in this case" data-tooltip="Find in this case" title="Find in this case">{% include 'ui/components/icon.html' with name='search' %}</button>
  <div id="case-search-popup" hidden>
    <p class="muted" data-search-empty hidden>No quick matches.</p>
    <div id="case-search-suggestions" role="listbox" aria-label="Quick matches in this case"></div>
  </div>
  <span class="visually-hidden" role="status" id="case-search-announcement"></span>
</form>
