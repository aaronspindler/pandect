{% load static %}
<link rel="stylesheet" href="{% static 'ui/dialog.css' %}">
<dialog id="quick-form-dialog" class="quick-dialog" aria-labelledby="quick-form-title" data-cases-url="{% url 'cases:case_list' %}">
  <header class="section-header">
    <h2 id="quick-form-title" tabindex="-1"></h2>
    <button type="button" class="button button-secondary" data-dialog-cancel>Close</button>
  </header>
  <p role="status" data-dialog-feedback></p>
  <div data-dialog-fields></div>
</dialog>
<script src="{% static 'ui/dialog.js' %}" defer></script>
