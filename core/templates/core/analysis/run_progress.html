{% if run.status == 'running' %}
  {% if run.started_at %}<p class="muted">{% include 'core/analysis/run_time.html' %}</p>{% endif %}
  <progress class="work-progress" aria-label="{{ run.progress_label }}"{% if run.parameters.writing_scope.version == 1 %} value="{{ run.progress }}" max="100"{% endif %}></progress>
{% endif %}
