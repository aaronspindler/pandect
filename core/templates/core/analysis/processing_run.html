<a class="record-row analysis-history-row" href="{% url 'core:analysis:detail' case.pk run.pk %}{{ history_suffix }}">
  <div><strong>{{ run.label }}</strong><p>{{ run.source_title }}</p><p class="muted">{{ run.created_at|date:'j M Y, H:i T' }}{% if run.status == 'running' %} · {{ run.progress }}%{% endif %}{% if run.failure_message %} · {{ run.failure_message }}{% endif %}</p></div>
  <span class="badge">{{ run.get_status_display }}</span>
</a>
