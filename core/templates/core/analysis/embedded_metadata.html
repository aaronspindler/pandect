<section class="analysis-finding" aria-labelledby="finding-heading-{{ tags.0.number }}">
  <header class="analysis-finding-heading">
    <h3 id="finding-heading-{{ tags.0.number }}">Embedded metadata{% for source in tags.0.sources %} · <a href="{{ source.url }}">{{ source.label }}</a>{% endfor %}</h3>
    <p class="muted">Unverified values from the file.</p>
  </header>
  <table class="analysis-metadata-table analysis-metadata-tags" aria-labelledby="finding-heading-{{ tags.0.number }}">
    <thead><tr><th scope="col">Tag</th><th scope="col">Value</th></tr></thead>
    <tbody>
      {% for item in tags %}
      <tr id="finding-{{ item.number }}">
        <th scope="row"><a class="analysis-finding-link" href="{{ item.url }}" id="finding-link-{{ item.number }}">{{ item.metadata_field }}</a>{% if item.review_reason %}<p class="muted">{{ item.review_reason }}</p>{% endif %}</th>
        <td class="analysis-metadata-value">{{ item.text }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
