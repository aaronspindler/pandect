{% extends 'core/evidence_chat/base.html' %}
{% block chat_content %}
<div class="chat-workspace">
  <div class="chat-main{% block chat_main_class %}{% endblock %}">
    {% block chat_main %}{% endblock %}
  </div>
  {% if thread %}
  {% include 'core/evidence_chat/history.html' with chats=recent_chats %}
  {% else %}
  {% include 'core/evidence_chat/history.html' with chats=page_obj %}
  {% endif %}
</div>
{% endblock %}
