{% load search_matches %}
<ul class="case-search-hits">
  {% for row in rows %}<li><a class="case-search-hit" href="{{ row.url }}">
    <strong>{{ row.title|highlight_first_match:query }}</strong>
    <span class="case-search-meta">{{ row.label }}</span>
    <span class="case-search-excerpt">{{ row.excerpt|highlight_first_match:query }}</span>
  </a></li>{% endfor %}
</ul>
